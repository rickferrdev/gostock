    github_com_rickferrdev_gostock_internal_core_ports.DTOResponseByIDProduct:
        properties:
            data:
                $ref: "#/definitions/github_com_rickferrdev_gostock_internal_core_ports.DTOProduct"
        type: object
    github_com_rickferrdev_gostock_internal_core_ports.DTOResponseByIDStock:
        properties:
            data:
                $ref: "#/definitions/github_com_rickferrdev_gostock_internal_core_ports.DTOStock"
        type: object
    github_com_rickferrdev_gostock_internal_core_ports.DTOResponseByStockIDProduct:
        properties:
            data:
                items:
                    $ref: "#/definitions/github_com_rickferrdev_gostock_internal_core_ports.DTOProduct"
                type: array
        type: object
    github_com_rickferrdev_gostock_internal_core_ports.DTOResponseCreateProduct:
        properties:
            data:
                $ref: "#/definitions/github_com_rickferrdev_gostock_internal_core_ports.DTOProduct"
        type: object
    github_com_rickferrdev_gostock_internal_core_ports.DTOResponseCreateStock:
        properties:
            data:
                $ref: "#/definitions/github_com_rickferrdev_gostock_internal_core_ports.DTOStock"
        type: object
