services:
    api:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: runtime
        container_name: gostock
        restart: unless-stopped
        ports:
            - "8080:8080"
        env_file:
            - ../.env
        volumes:
            - sqlite_data:/app/database
        healthcheck:
            test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

volumes:
    sqlite_data:
        driver: local
