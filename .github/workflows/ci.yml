name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    lint:
        runs-on: "ubuntu-latest"
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.11
                  skip-cache: false

    security:
        runs-on: "ubuntu-latest"
        steps:
            - uses: actions/checkout@v6
            - uses: golang/govulncheck-action@v1
              with:
                  go-package: ./...

    test:
        runs-on: "ubuntu-latest"
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: stable
                  cache: true
            - name: test
              run: make test
